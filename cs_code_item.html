<!DOCTYPE html>
<html>
  <head>
    <title>Some good looking iframe</title>
    <style>
      body {
        font-family: Verdana,Arial,Helvetica,sans-serif;
        font-size: 14px;
        line-height: 1.4
      }

      .outer {
        display: flex;
      }

      .text {
        flex-grow: 1;
        color: #181818;
      }

      .image {
        width: 7px;
        height: 13px;
        align-self: center;
      }
    </style>
  </head>
  <body>
    <div class="outer">
      <div class="text">
        Nur noch <strong>300 €</strong> für Ihren <strong>MacBook</strong>
      </div>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 7.7 13.7" style="enable-background:new 0 0 7.7 13.7" xml:space="preserve">
          <path vector-effect="non-scaling-stroke" style="fill:#949494" d="M4.6 5.9-1 11.6l1.1 1.1 6.6-6.8L.1-1-1 .1z" transform="translate(1 1)"/>
      </svg>
    </div>
    <script>
      window.parent.postMessage(["setHeight", 20], "*");
    </script>
  </body>
</html>
